[project]
name = "nlp-labs"
version = "0.1.0"
description = "NLP labs: shared uv environment (lab1, lab2, ...)"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lab1*"]
